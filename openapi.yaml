openapi: 3.0.3
info:
  title: API de Productos y Ordenes
  description: >
    API REST para dar soporte a la venta de artículos, tanto presencial como
    por pedidos web. Expone los recursos Productos y Ordenes bajo un estilo
    arquitectónico de microservicios.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Entorno local (Docker)

tags:
  - name: Productos
  - name: Ordenes

paths:

  /api/productos:
    get:
      tags:
        - Productos
      summary: Listar productos
      description: Devuelve un listado de todos los productos disponibles.
      operationId: listarProductos
      responses:
        '200':
          description: Lista de productos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'
                example:
                - id: "65a1f0c2e4b0a1a2b3c4d5e6"
                  nombre: "Notebook Lenovo ThinkPad"
                  descripcion: "Notebook Intel i7 16GB RAM"
                  precioUnitario: 1250.50
                  stock: 15
                  imagenes:
                    - "https://cdn.example.com/img/notebook-1.jpg"
                    - "https://cdn.example.com/img/notebook-2.jpg
  
  post:
      tags: [Productos]
      summary: Crear un nuevo producto
      operationId: crearProducto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInput'
      responses:
        '201':
          description: Producto creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdGenerado'
              example:
                id: "65a1f0c2e4b0a1a2b3c4d5e6"
        '400':
          description: Datos inválidos para crear el producto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/productos/{id}:
    parameters:
      - $ref: '#/components/parameters/ProductoId'

    get:
      tags: [Productos]
      summary: Obtener un producto por identificador
      operationId: obtenerProducto
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '404':
          description: El producto no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Productos]
      summary: Reemplazar todos los datos de un producto existente
      operationId: reemplazarProducto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoInput'
      responses:
        '200':
          description: Producto actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '404':
          description: El producto no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    patch:
      tags: [Productos]
      summary: Actualizar parcialmente un producto existente
      operationId: actualizarProductoParcial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductoPatch'
      responses:
        '200':
          description: Producto actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
        '404':
          description: El producto no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ordenes:
      get:
        tags: [Ordenes]
        summary: Obtener el listado de órdenes
        operationId: listarOrdenes
        responses:
          '200':
            description: Lista de órdenes obtenida exitosamente
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Orden'
                example:
                  - id: "65b2a1d3f5c0b2b3c4d5e6f7"
                    email: "cliente@email.com"
                    direccionEnvio: "Av. Italia 3333, Maldonado"
                    telefono: "+59899111222"
                    estado: "Created"
                    fechaCreacion: "2026-06-21T14:30:00-03:00"
                    productos:
                      - productoId: "65a1f0c2e4b0a1a2b3c4d5e6"
                        cantidad: 2
                      - productoId: "65a1f0c2e4b0a1a2b3c4d5e7"
                        cantidad: 5
      post:
        tags: [Ordenes]
        summary: Crear una nueva orden de compra
        operationId: crearOrden
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenInput'
        responses:
          '201':
            description: Orden creada exitosamente
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/IdGenerado'
                example:
                  id: "65b2a1d3f5c0b2b3c4d5e6f7"
          '400':
            description: Datos inválidos para crear la orden
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'
          '409':
            description: >
              Stock insuficiente para alguno de los productos solicitados,
              o alguno de los productos indicados no existe
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Error'

  /api/ordenes/{id}:
    parameters:
      - $ref: '#/components/parameters/OrdenId'

    get:
      tags: [Ordenes]
      summary: Obtener una orden por identificador
      operationId: obtenerOrden
      responses:
        '200':
          description: Orden encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orden'
        '404':
          description: La orden no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/ordenes/{id}/detalle:
    parameters:
      - $ref: '#/components/parameters/OrdenId'

    get:
      tags: [Ordenes]
      summary: Obtener una orden con el detalle completo de cada producto solicitado
      operationId: obtenerDetalleOrden
      responses:
        '200':
          description: Detalle de la orden encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdenDetalle'
        '404':
          description: La orden no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:

  parameters:
    ProductoId:
      name: id
      in: path
      required: true
      description: Identificador del producto (ObjectId de MongoDB)
      schema:
        type: string
        example: "65a1f0c2e4b0a1a2b3c4d5e6"

    OrdenId:
      name: id
      in: path
      required: true
      description: Identificador de la orden (ObjectId de MongoDB)
      schema:
        type: string
        example: "65b2a1d3f5c0b2b3c4d5e6f7"

  schemas:

    Producto:
      type: object
      properties:
        id:
          type: string
          description: Identificador generado por MongoDB (ObjectId)
          example: "65a1f0c2e4b0a1a2b3c4d5e6"
        nombre:
          type: string
          example: "Notebook Lenovo ThinkPad"
        descripcion:
          type: string
          example: "Notebook Intel i7 16GB RAM"
        precioUnitario:
          type: number
          format: double
          example: 1250.50
        stock:
          type: integer
          example: 15
        imagenes:
          type: array
          description: Lista de links a imágenes del producto
          items:
            type: string
            format: uri
          example:
            - "https://cdn.example.com/img/notebook-1.jpg"
            - "https://cdn.example.com/img/notebook-2.jpg"

    ProductoInput:
      type: object
      required:
        - nombre
        - descripcion
        - precioUnitario
        - stock
      properties:
        nombre:
          type: string
          example: "Notebook Lenovo ThinkPad"
        descripcion:
          type: string
          example: "Notebook Intel i7 16GB RAM"
        precioUnitario:
          type: number
          format: double
          example: 1250.50
        stock:
          type: integer
          example: 15
        imagenes:
          type: array
          items:
            type: string
            format: uri

    ProductoPatch:
      type: object
      description: Campos a modificar; se admite cualquier subconjunto de los atributos del producto
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        precioUnitario:
          type: number
          format: double
        stock:
          type: integer
        imagenes:
          type: array
          items:
            type: string
            format: uri

    OrdenProducto:
      type: object
      required:
        - productoId
        - cantidad
      properties:
        productoId:
          type: string
          description: Identificador del producto (ObjectId de MongoDB)
          example: "65a1f0c2e4b0a1a2b3c4d5e6"
        cantidad:
          type: integer
          example: 2

    Orden:
      type: object
      properties:
        id:
          type: string
          description: Identificador generado por MongoDB (ObjectId)
          example: "65b2a1d3f5c0b2b3c4d5e6f7"
        email:
          type: string
          format: email
          example: "cliente@email.com"
        direccionEnvio:
          type: string
          example: "Av. Italia 3333, Maldonado"
        telefono:
          type: string
          example: "+59899111222"
        estado:
          type: string
          example: "Created"
        fechaCreacion:
          type: string
          format: date-time
          example: "2026-06-21T14:30:00-03:00"
        productos:
          type: array
          items:
            $ref: '#/components/schemas/OrdenProducto'

    OrdenInput:
      type: object
      required:
        - email
        - direccionEnvio
        - telefono
        - productos
      properties:
        email:
          type: string
          format: email
          example: "cliente@email.com"
        direccionEnvio:
          type: string
          example: "Av. Italia 3333, Maldonado"
        telefono:
          type: string
          example: "+59899111222"
        productos:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrdenProducto'

    OrdenDetalleProducto:
      type: object
      description: Detalle completo del producto solicitado junto a la cantidad pedida
      properties:
        producto:
          $ref: '#/components/schemas/Producto'
        cantidad:
          type: integer
          example: 2

    OrdenDetalle:
      type: object
      properties:
        id:
          type: string
          description: Identificador generado por MongoDB (ObjectId)
          example: "65b2a1d3f5c0b2b3c4d5e6f7"
        email:
          type: string
          format: email
          example: "cliente@email.com"
        direccionEnvio:
          type: string
          example: "Av. Italia 3333, Maldonado"
        telefono:
          type: string
          example: "+59899111222"
        estado:
          type: string
          example: "Created"
        fechaCreacion:
          type: string
          format: date-time
          example: "2026-06-21T14:30:00-03:00"
        productos:
          type: array
          items:
            $ref: '#/components/schemas/OrdenDetalleProducto'

    IdGenerado:
      type: object
      properties:
        id:
          type: string
          example: "65a1f0c2e4b0a1a2b3c4d5e6"

    Mensaje:
      type: object
      properties:
        mensaje:
          type: string
          example: "Operación realizada exitosamente"

    Error:
      type: object
      properties:
        mensaje:
          type: string
          example: "El recurso solicitado no existe"